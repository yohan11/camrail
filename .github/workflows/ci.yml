name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: camrail_user
          POSTGRES_PASSWORD: camrail_password
          POSTGRES_DB: railmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx
        
    - name: Prepare Offline Models
      run: |
        python scripts/prepare_models.py
        
    - name: Setup Database
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://camrail_user:camrail_password@localhost:5432/railmind
      run: |
        alembic upgrade head
        
    - name: Run Pytest & Confidentiality Tests
      working-directory: ./backend
      env:
        DATABASE_URL: postgresql://camrail_user:camrail_password@localhost:5432/railmind
        LLM_PROVIDER: ollama
      run: |
        pytest tests/ -v
