# ==============================================================================
# CAMRAIL RailMind Lite - Configuration Nginx Haute Sécurité (HTTPS / TLS)
# ==============================================================================
# Rôles et responsabilités de ce reverse-proxy :
# 1. Terminaison TLS 1.2 / 1.3 avec suites cryptographiques modernes.
# 2. Redirection automatique et stricte de l'ensemble du trafic HTTP (80) vers HTTPS (443).
# 3. Routage unifié sur la même origine :
#    - /     -> Frontend Next.js (port 3000)
#    - /api/ -> Backend FastAPI (port 8000)
# 4. Support temps réel Server-Sent Events (SSE) :
#    - Désactivation du tamponnage (proxy_buffering off)
#    - Timeout de lecture étendu à 300s pour les générations LLM longues.
# 5. Protection contre les dénis de service et plafonnement des téléversements (25M).
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Masquage de la version de Nginx pour limiter l'empreinte reconnaissance
    server_tokens off;

    # Optimisation des performances réseau
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Plafond de taille des requêtes HTTP (synchronisé avec MAX_UPLOAD_MB=25)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # 1. Redirection HTTP vers HTTPS (Port 80 -> Port 443)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Redirection permanente 301 vers la version chiffrée
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # 2. Serveur Principal Sécurisé HTTPS (Port 443)
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # Certificats SSL/TLS montés depuis le volume deploy/certs/
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Protocoles autorisés : TLS 1.2 et TLS 1.3 exclusivement (SSLv3, TLS 1.0/1.1 proscrits)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Suites de chiffrement modernes avec Perfect Forward Secrecy (PFS)
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # Gestion et mise en cache des sessions TLS
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # En-têtes de sécurité renforcés injectés au niveau reverse-proxy
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        # ----------------------------------------------------------------------
        # A. Route streaming SSE du LLM (/api/.../stream)
        # Nécessite l'extinction du buffering pour l'effet typewriter temps réel
        # ----------------------------------------------------------------------
        location ~* ^/api(/v1)?/assistant/query/stream {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering désactivé pour transmettre immédiatement chaque token généré
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            chunked_transfer_encoding on;
        }

        # ----------------------------------------------------------------------
        # B. API Backend (/api/)
        # ----------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ----------------------------------------------------------------------
        # C. Frontend Next.js (/)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;

            # Support des WebSockets et de l'hydratation Next.js
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }
    }
}
